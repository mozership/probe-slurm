name: slurm
description: Submit, watch and cancel jobs of Slurm, and read the state of its partitions and nodes, on a login node over SSH, on the host Probe runs on, or by slurmrestd
guard: [read-only, allow-host]
params: [submit, job, jobs, cancel, partitions, nodes, wait, poll, output, host, port, user, key_file, key_passphrase, known_hosts, bin_dir, endpoint, token, timeout]
res: [job_id, cluster, error, name, user, account, partition, state, reason, nodes, exit_code, signal, submit_time, start_time, end_time, wait_sec, elapsed_sec, stdout_path, done, stdout, stdout_truncated, jobs, count, cancelled, partitions]
cleanup: true
runs:
  using: binary
  url: https://github.com/mozership/probe-slurm/releases/download/v0.2.0/probe-slurm_{os}_{arch}
  checksums:
    darwin_amd64: "ef29673112fa68fa3ff82ad868fc7a4ccf3fd6f8481012e306196e8772a1bd87"
    darwin_arm64: "e5900be5ac2c0e156b9e310bbdafa88a5af5630b984337519b34bf212ca93965"
    linux_amd64: "3242c8b298c28ebd6fe051a976ecf7a352f3a0d5efbad78e131d5129448c9ed3"
    linux_arm64: "c167bf8efcd2eca0e1263d0c5a6dda9aa17101cd16f9f9befb2cb5eb6c1c97d3"
