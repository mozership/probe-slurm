# Run by e2e/workflow.yml against the cluster it started: submits a job and
# leaves it running, for the cleanup of the run to cancel.
name: probe-slurm leaves a job behind

actions:
  slurm: ./action

vars:
  port: "{{E2E_PORT}}"
  work: "{{E2E_WORK}}"

jobs:
- name: Leave a job
  steps:
  - name: Submit a job that sleeps
    uses: slurm
    with:
      host: localhost
      port: "{{vars.port}}"
      user: probe
      key_file: "{{vars.work}}/id_ed25519"
      known_hosts: "{{vars.work}}/known_hosts"
      submit:
        name: left-behind
        script: |
          #!/bin/sh
          sleep 300
    test: status == 0 && res.job_id > 0
